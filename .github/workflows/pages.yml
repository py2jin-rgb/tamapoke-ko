name: Build firmware and deploy installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract validated CLEAN v1.2 source
        run: |
          rm -rf source source_alarm source_combo
          mkdir -p source
          unzip -q source_package.zip -d source
          test -f source/TamaPoke/TamaPoke.ino

      - name: Patch Korean stable text renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('source/TamaPoke/TamaPoke.ino')
          s = p.read_text(encoding='utf-8')
          pat1 = r'gfx->setTextColor\(ink\);\s*gfx->setCursor\(CX - strlen\(rec\) \* 6, 214\);\s*gfx->print\(rec\);'
          pat2 = r'gfx->setTextSize\(2\);\s*gfx->setCursor\(CX - strlen\(rec\) \* 6, 76\);\s*gfx->print\(rec\);'
          pat3 = r'gfx->setTextColor\(ink\);\s*gfx->setCursor\(CX - strlen\(r\) \* 6, 256\);\s*gfx->print\(r\);'
          s, n1 = re.subn(pat1, 'uiPrintCenter(rec, 214, ink, 2);', s, count=1)
          s, n2 = re.subn(pat2, 'uiPrintCenter(rec, 76, ink, 2);', s, count=1)
          s, n3 = re.subn(pat3, 'uiPrintCenter(r, 256, ink, 2);', s, count=1)
          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit(f'Korean renderer patch count mismatch: gameover={n1}, live={n2}, training={n3}')
          p.write_text(s, encoding='utf-8')
          print('stable Korean renderers patched')
          PY

      - name: Prepare alarm source
        run: |
          mkdir -p source_alarm
          cp -a source/TamaPoke source_alarm/TamaPoke
          cat alarm_test/patch_01.b64 alarm_test/patch_02.b64 alarm_test/patch_03.b64 alarm_test/patch_04.b64 \
            | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/alarm_test.patch
          cd source_alarm/TamaPoke
          patch -p1 < /tmp/alarm_test.patch
          test -f alarm.cpp
          test -f alarm.h
          test -f alarm_font.h
          grep -q '1.5-ko-alarm1.0' TamaPoke.ino
          cd ../..
          python3 alarm_test/ui_fix_v11.py
          grep -q '1.5-ko-alarm1.1' source_alarm/TamaPoke/TamaPoke.ino
          echo 'alarm source prepared'

      - name: Prepare alarm + Cheonjiin source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum python3-pil
          mkdir -p source_combo
          cp -a source_alarm/TamaPoke source_combo/TamaPoke
          cp combo_test/hangul_cheonjiin.h source_combo/TamaPoke/hangul_cheonjiin.h
          python3 combo_test/gen_hangul_font.py source_combo/TamaPoke/hangul_full16.h
          cd source_combo/TamaPoke
          patch -p1 < ../../combo_test/keyboard.patch
          cd ../..
          python3 combo_test/day_standby_v11.py
          grep -q '1.6-ko-combo1.1' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'char nick\[40\]' source_combo/TamaPoke/pet.h
          grep -q 'drawStandbyAwakePet' source_combo/TamaPoke/TamaPoke.ino
          test -s source_combo/TamaPoke/hangul_full16.h
          echo 'combo source prepared'

      - name: Apply shared stability fixes
        run: |
          python3 stability_fix_v12.py source/TamaPoke source_alarm/TamaPoke source_combo/TamaPoke
          grep -q 'stability1' source/TamaPoke/TamaPoke.ino
          grep -q 'stability1' source_alarm/TamaPoke/TamaPoke.ino
          grep -q 'stability1' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'return pet.sleeping || millis() - lastInteract >= 30000UL;' source_alarm/TamaPoke/TamaPoke.ino
          grep -q 'return pet.sleeping || millis() - lastInteract >= 30000UL;' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'const bool dayMode = !pet.sleeping' source_combo/TamaPoke/TamaPoke.ino
          echo 'three stability sources verified'

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Configure ESP32 board manager
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 core 3.1.0
        run: arduino-cli core install esp32:esp32@3.1.0

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.7"
          arduino-cli lib install "SensorLib@0.3.1"
          arduino-cli lib install "XPowersLib@0.2.6"

      - name: Compile basic firmware
        run: |
          rm -rf build_stable && mkdir build_stable
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-path build_stable source/TamaPoke
          test -f build_stable/TamaPoke.ino.bin

      - name: Compile alarm firmware
        run: |
          rm -rf build_alarm && mkdir build_alarm
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-path build_alarm source_alarm/TamaPoke
          test -f build_alarm/TamaPoke.ino.bin

      - name: Compile alarm + Cheonjiin firmware
        run: |
          rm -rf build_combo && mkdir build_combo
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-path build_combo source_combo/TamaPoke
          test -f build_combo/TamaPoke.ino.bin

      - name: Prepare three web installers
        run: |
          set -e
          rm -rf site
          mkdir -p site/firmware
          cp docs/index.html site/index.html
          python3 combo_test/page_v11.py
          touch site/.nojekyll

          STABLE=build_stable/TamaPoke.ino.bin
          SSHA=$(sha256sum "$STABLE" | awk '{print $1}')
          SSHORT=${SSHA:0:12}
          SFW=tamapoke-ko-basic-stability1-${SSHORT}.bin
          cp "$STABLE" "site/firmware/$SFW"
          cat > site/manifest.json <<EOF
          {"name":"TamaPoke KO Basic","version":"1.4-ko-stability1-${SSHORT}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/$SFW","offset":65536}]}]}
          EOF

          ALARM=build_alarm/TamaPoke.ino.bin
          ASHA=$(sha256sum "$ALARM" | awk '{print $1}')
          ASHORT=${ASHA:0:12}
          AFW=tamapoke-ko-alarm-stability1-${ASHORT}.bin
          cp "$ALARM" "site/firmware/$AFW"
          cat > site/manifest-alarm.json <<EOF
          {"name":"TamaPoke KO Alarm","version":"1.5-ko-alarm1.1-stability1-${ASHORT}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/$AFW","offset":65536}]}]}
          EOF

          COMBO=build_combo/TamaPoke.ino.bin
          CSHA=$(sha256sum "$COMBO" | awk '{print $1}')
          CSHORT=${CSHA:0:12}
          CFW=tamapoke-ko-alarm-cheonjiin-stability1-${CSHORT}.bin
          cp "$COMBO" "site/firmware/$CFW"
          cat > site/manifest-combo.json <<EOF
          {"name":"TamaPoke KO Alarm + Cheonjiin","version":"1.6-ko-combo1.1-stability1-${CSHORT}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/$CFW","offset":65536}]}]}
          EOF

          printf 'Basic SHA256: %s\nAlarm SHA256: %s\nAlarm+Cheonjiin SHA256: %s\nFlash offset: 0x10000\nStability1: Korean medal popup/badges fixed; sleep shows current time; alarm/combo manual sleep enters clock immediately and first standby gesture wakes/resumes; combo manual sleep overrides daytime walking scene.\n' "$SSHA" "$ASHA" "$CSHA" > site/build-info.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
