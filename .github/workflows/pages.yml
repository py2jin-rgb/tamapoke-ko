name: Build firmware and deploy installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base source
        run: |
          rm -rf source source_alarm source_combo
          mkdir -p source
          unzip -q source_package.zip -d source
          test -f source/TamaPoke/TamaPoke.ino

      - name: Patch stable Korean renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('source/TamaPoke/TamaPoke.ino')
          s=p.read_text(encoding='utf-8')
          pats=[
            (r'gfx->setTextColor\(ink\);\s*gfx->setCursor\(CX - strlen\(rec\) \* 6, 214\);\s*gfx->print\(rec\);','uiPrintCenter(rec, 214, ink, 2);'),
            (r'gfx->setTextSize\(2\);\s*gfx->setCursor\(CX - strlen\(rec\) \* 6, 76\);\s*gfx->print\(rec\);','uiPrintCenter(rec, 76, ink, 2);'),
            (r'gfx->setTextColor\(ink\);\s*gfx->setCursor\(CX - strlen\(r\) \* 6, 256\);\s*gfx->print\(r\);','uiPrintCenter(r, 256, ink, 2);'),
          ]
          for pat,repl in pats:
            s,n=re.subn(pat,repl,s,count=1)
            if n!=1: raise SystemExit('stable renderer patch mismatch')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Prepare alarm source
        run: |
          mkdir -p source_alarm
          cp -a source/TamaPoke source_alarm/TamaPoke
          cat alarm_test/patch_01.b64 alarm_test/patch_02.b64 alarm_test/patch_03.b64 alarm_test/patch_04.b64 | tr -d '\r\n' | base64 -d | gzip -dc > /tmp/alarm.patch
          cd source_alarm/TamaPoke
          patch -p1 < /tmp/alarm.patch
          cd ../..
          python3 alarm_test/ui_fix_v11.py
          test -f source_alarm/TamaPoke/alarm.cpp
          grep -q '1.5-ko-alarm1.1' source_alarm/TamaPoke/TamaPoke.ino

      - name: Prepare alarm plus Cheonjiin source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum python3-pil
          mkdir -p source_combo
          cp -a source_alarm/TamaPoke source_combo/TamaPoke
          cp combo_test/hangul_cheonjiin.h source_combo/TamaPoke/hangul_cheonjiin.h
          python3 combo_test/gen_hangul_font.py source_combo/TamaPoke/hangul_full16.h
          cd source_combo/TamaPoke
          patch -p1 < ../../combo_test/keyboard.patch
          cd ../..
          python3 combo_test/day_standby_v11.py
          grep -q '1.6-ko-combo1.1' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'char nick\[40\]' source_combo/TamaPoke/pet.h
          test -s source_combo/TamaPoke/hangul_full16.h

      - name: Apply stability2 fixes
        run: |
          python3 stability_fix_v12.py source/TamaPoke source_alarm/TamaPoke source_combo/TamaPoke
          grep -q 'stability2' source/TamaPoke/TamaPoke.ino
          grep -q 'stability2' source_alarm/TamaPoke/TamaPoke.ino
          grep -q 'stability2' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'bool manualClockView = false' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'manualClockView = !manualClockView' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'const bool dayMode = !pet.sleeping' source_combo/TamaPoke/TamaPoke.ino

      - name: Add expandable games to combo only
        run: |
          python3 combo_test/minigames_v1.py source_combo/TamaPoke
          grep -q '1.7-ko-combo-games1' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'bool gameMenuOpen = false' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'void startMole()' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'void startRps()' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'SFX_MOLE_HIT3' source_combo/TamaPoke/audio.h
          grep -q 'moleHi' source_combo/TamaPoke/pet.h
          grep -q 'rpsHi' source_combo/TamaPoke/pet.h

      - name: Add date setting and larger fonts to combo only
        run: |
          python3 combo_test/date_font_v2.py source_combo/TamaPoke
          grep -q '1.8-ko-combo-games1-datefont' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'int clockY = 2026' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'renderDateAdjust' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'clockPage=5' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'gLang == LANG_KO ? 3 : 2' source_combo/TamaPoke/TamaPoke.ino
          echo 'combo date/font source checks passed'

      - name: Add 151-level picture quiz to combo only
        run: |
          python3 combo_test/quiz151_v1.py source_combo/TamaPoke
          grep -q '1.9-ko-combo-quiz151' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'void startQuiz151()' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'QUIZ151_ORDER\[151\]' source_combo/TamaPoke/TamaPoke.ino
          grep -q '151 포켓몬 퀴즈' source_combo/TamaPoke/TamaPoke.ino
          grep -q 'quizLv' source_combo/TamaPoke/pet.h
          grep -q 'setQuizLevel' source_combo/TamaPoke/pet.cpp
          echo 'combo quiz151 source checks passed'

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Configure ESP32
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.0
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino@1.6.7"
          arduino-cli lib install "SensorLib@0.3.1"
          arduino-cli lib install "XPowersLib@0.2.6"

      - name: Compile basic firmware
        run: |
          rm -rf build_stable && mkdir build_stable
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" --build-path build_stable source/TamaPoke
          test -f build_stable/TamaPoke.ino.bin

      - name: Compile alarm firmware
        run: |
          rm -rf build_alarm && mkdir build_alarm
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" --build-path build_alarm source_alarm/TamaPoke
          test -f build_alarm/TamaPoke.ino.bin

      - name: Compile alarm plus Cheonjiin games date-font quiz151 firmware
        run: |
          rm -rf build_combo && mkdir build_combo
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" --build-path build_combo source_combo/TamaPoke
          test -f build_combo/TamaPoke.ino.bin

      - name: Prepare web installers
        run: |
          set -e
          rm -rf site
          mkdir -p site/firmware
          cp docs/index.html site/index.html
          python3 combo_test/page_v11.py
          python3 combo_test/page_quiz151.py
          touch site/.nojekyll

          STABLE=build_stable/TamaPoke.ino.bin
          SSHA=$(sha256sum "$STABLE" | awk '{print $1}')
          SSHORT=${SSHA:0:12}
          SFW=tamapoke-ko-basic-stability2-${SSHORT}.bin
          cp "$STABLE" "site/firmware/$SFW"
          cat > site/manifest.json <<EOF
          {"name":"TamaPoke KO Basic","version":"1.4-ko-stability2-${SSHORT}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/$SFW","offset":65536}]}]}
          EOF

          ALARM=build_alarm/TamaPoke.ino.bin
          ASHA=$(sha256sum "$ALARM" | awk '{print $1}')
          ASHORT=${ASHA:0:12}
          AFW=tamapoke-ko-alarm-stability2-${ASHORT}.bin
          cp "$ALARM" "site/firmware/$AFW"
          cat > site/manifest-alarm.json <<EOF
          {"name":"TamaPoke KO Alarm","version":"1.5-ko-alarm1.1-stability2-${ASHORT}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/$AFW","offset":65536}]}]}
          EOF

          COMBO=build_combo/TamaPoke.ino.bin
          CSHA=$(sha256sum "$COMBO" | awk '{print $1}')
          CSHORT=${CSHA:0:12}
          CFW=tamapoke-ko-alarm-cheonjiin-games-date-quiz151-${CSHORT}.bin
          cp "$COMBO" "site/firmware/$CFW"
          cat > site/manifest-combo.json <<EOF
          {"name":"TamaPoke KO Alarm + Cheonjiin + Games + Date + Quiz151","version":"1.9-ko-combo-quiz151-${CSHORT}","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware/$CFW","offset":65536}]}]}
          EOF

          printf 'Basic SHA256: %s\nAlarm SHA256: %s\nCombo SHA256: %s\nFlash offset: 0x10000\nCombo 1.9: Quiz151 + Games1 + larger Korean UI fonts + RTC date editor; Cheonjiin/alarm/PWR clock/minigame SFX retained. Quiz progress is stored in NVS.\n' "$SSHA" "$ASHA" "$CSHA" > site/build-info.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
