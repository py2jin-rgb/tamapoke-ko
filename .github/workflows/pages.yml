name: Build firmware and deploy installer

on:
  push:
    branches: [main, 'battery-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Korean font generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-nanum=20200506-1 python3-pil

      - name: Install pinned Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'

      - name: Cache the pinned ESP32 toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-linux-cli131-esp32310-gfx167-sensor031-xpowers026-v1

      - name: Configure pinned core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.0
          arduino-cli lib update-index
          arduino-cli lib install 'GFX Library for Arduino@1.6.7'
          arduino-cli lib install 'SensorLib@0.3.1'
          arduino-cli lib install 'XPowersLib@0.2.6'

      - name: Verify power decisions and source contracts
        run: |
          mkdir -p .build/tests
          g++ -std=c++17 -Wall -Wextra -pedantic tests/test_power_policy.cpp -o .build/tests/test_power_policy
          .build/tests/test_power_policy
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/audio/run.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Compile canonical edition 5 once
        run: python3 tools/build_release.py

      - name: Package edition 5 and preserve exact previous firmware
        run: python3 tools/package_release.py

      - name: Validate firmware, OTA metadata, installers and retained binaries
        run: python3 tools/validate_release.py site --expected-commit "$GITHUB_SHA"

      - name: Keep the reviewed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-release-${{ github.sha }}
          path: site
          include-hidden-files: true
          retention-days: 30

      - name: Configure Pages for main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact for main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
